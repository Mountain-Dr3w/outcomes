<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect width="1440" height="700" fill="#171b1d"/><g font-family="Arial,sans-serif"><text x="64" y="68" fill="#f0f2ee" font-size="30">Getting to the work</text><text x="64" y="102" fill="#aeb7b8" font-size="16">Start-of-shift journey reconstruction</text><text x="64" y="175" fill="#aeb7b8" font-size="14">DOCUMENT-BASED START</text><text x="1376" y="178" text-anchor="end" fill="#f0f2ee" font-size="28">~45 minutes</text><path d="M82 225H330" stroke="#657174"/><circle cx="73" cy="225" r="9" fill="#171b1d" stroke="#aeb7b8"/><text x="64" y="276" fill="#f0f2ee" font-size="19">Find the document</text><text x="64" y="310" fill="#aeb7b8" font-size="14">Locate the starting links.</text><path d="M348 225H596" stroke="#657174"/><circle cx="339" cy="225" r="9" fill="#171b1d" stroke="#aeb7b8"/><text x="330" y="276" fill="#f0f2ee" font-size="19">Orient to the shift</text><text x="330" y="310" fill="#aeb7b8" font-size="14">Gather current context.</text><path d="M614 225H862" stroke="#657174"/><circle cx="605" cy="225" r="9" fill="#171b1d" stroke="#aeb7b8"/><text x="596" y="276" fill="#f0f2ee" font-size="19">Reconcile the work</text><text x="596" y="310" fill="#aeb7b8" font-size="14">Identify tasks and owners.</text><path d="M880 225H1128" stroke="#657174"/><circle cx="871" cy="225" r="9" fill="#171b1d" stroke="#aeb7b8"/><text x="862" y="276" fill="#f0f2ee" font-size="19">Open the tools</text><text x="862" y="310" fill="#aeb7b8" font-size="14">Assemble the workspace.</text><circle cx="1137" cy="225" r="9" fill="#171b1d" stroke="#aeb7b8"/><text x="1128" y="276" fill="#f0f2ee" font-size="19">Get on mission</text><text x="1128" y="310" fill="#aeb7b8" font-size="14">Begin the assigned work.</text><path d="M64 367H1376" stroke="#3a4447"/><text x="64" y="426" fill="#aeb7b8" font-size="14">CREW PAGE</text><text x="1376" y="429" text-anchor="end" fill="#e9ac7d" font-size="28">~4 minutes</text><path d="M82 478H414" stroke="#9a806b"/><circle cx="73" cy="478" r="9" fill="#e9ac7d"/><text x="64" y="529" fill="#f0f2ee" font-size="19">Review the handoff</text><text x="64" y="563" fill="#aeb7b8" font-size="14">See what changed.</text><path d="M432 478H764" stroke="#9a806b"/><circle cx="423" cy="478" r="9" fill="#e9ac7d"/><text x="414" y="529" fill="#f0f2ee" font-size="19">Choose the work</text><text x="414" y="563" fill="#aeb7b8" font-size="14">Confirm ownership and next step.</text><path d="M782 478H1114" stroke="#9a806b"/><circle cx="773" cy="478" r="9" fill="#e9ac7d"/><text x="764" y="529" fill="#f0f2ee" font-size="19">Open the right tool</text><text x="764" y="563" fill="#aeb7b8" font-size="14">Keep the request in context.</text><circle cx="1123" cy="478" r="9" fill="#e9ac7d"/><text x="1114" y="529" fill="#f0f2ee" font-size="19">Get on mission</text><text x="1114" y="563" fill="#aeb7b8" font-size="14">Begin the assigned work.</text><text x="64" y="651" fill="#aeb7b8" font-size="13">Total times reflect the reported project result. Individual steps are not timed.</text></g></svg>