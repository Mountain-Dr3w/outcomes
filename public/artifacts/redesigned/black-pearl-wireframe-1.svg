y comes first.</text><text x="1090" y="210" font-family="Arial,sans-serif" font-size="15" fill="#343b3c">START WITH ACCESS</text><text x="1090" y="250" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">Bring the document’s links</text><text x="1090" y="279" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">into one shared page.</text><text x="1090" y="308" font-family="Arial,sans-serif" font-size="17" fill="#343b3c"></text><text x="1090" y="337" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">Shift notes, requests, and</text><text x="1090" y="366" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">tools all compete for the</text><text x="1090" y="395" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">analyst’s attention.</text><text x="1090" y="424" font-family="Arial,sans-serif" font-size="17" fill="#343b3c"></text><text x="1090" y="453" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">Keep: a single entry point.</text><text x="1090" y="482" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">Change: establish a clear</text><text x="1090" y="511" font-family="Arial,sans-serif" font-size="17" fill="#343b3c">first action.</text></svg>